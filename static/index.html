<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1B3A2F;
      --parchment: #EFE9DC;
      --brass: #B08D57;
      --maroon: #6B1F2A;
      --ink: #2B2B28;
      --card: #FDFBF3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .page { width: 100%; max-width: 640px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid var(--brass);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin: 0;
      color: var(--forest);
    }
    .est {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--brass);
      text-transform: uppercase;
    }
    .hint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hint-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--brass);
      margin-right: 4px;
    }
    .chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      background: none;
      border: 1px solid var(--brass);
      color: var(--forest);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .chip:hover { background: var(--brass); color: #fff; }
    #chat {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 420px;
      overflow-y: auto;
      padding: 8px 4px 16px;
      margin-bottom: 20px;
    }
    .card {
      position: relative;
      max-width: 78%;
      background: var(--card);
      border: 1px solid rgba(43,43,40,0.15);
      box-shadow: 0 2px 4px rgba(43,43,40,0.08);
      padding: 16px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadein 0.25s ease;
    }
    .card .tab {
      position: absolute;
      top: -10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 2px 8px;
      color: #fff;
      text-transform: uppercase;
    }
    .student { align-self: flex-start; }
    .student .tab { left: 12px; background: var(--maroon); }
    .advisor { align-self: flex-end; }
    .advisor .tab { right: 12px; background: var(--forest); }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
    .input-row {
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(43,43,40,0.2);
      padding-top: 16px;
    }
    input#question {
      flex: 1;
      font-family: 'Source Serif 4', serif;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid var(--brass);
      background: var(--card);
      color: var(--ink);
    }
    input#question:focus {
      outline: 2px solid var(--forest);
      outline-offset: 1px;
    }
    button#send {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--forest);
      color: #fff;
      border: none;
      padding: 0 20px;
      cursor: pointer;
    }
    button#send:hover { background: #142d24; }
    button#send:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
    @media (max-width: 480px) {
      .card { max-width: 90%; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>University Advisor</h1>
      <span class="est">Est. 2026 &middot; Records Office</span>
    </header>

    <div class="hint">
      <span class="hint-label">Try asking:</span>
      <button class="chip" onclick="ask('Tuition at Berkeley')">Tuition at Berkeley</button>
      <button class="chip" onclick="ask('Compare Berkeley and UCLA')">Compare Berkeley and UCLA</button>
      <button class="chip" onclick="ask('Admission rate at Harvard')">Admission rate at Harvard</button>
    </div>

    <div id="chat"></div>
    <div class="input-row">
      <input id="question" type="text" placeholder="Ask about a school...">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const sessionId = "session-" + Math.random().toString(36).slice(2);
    const chatDiv = document.getElementById("chat");
    const input = document.getElementById("question");

    function formatText(text) {
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function addMessage(text, who) {
      const card = document.createElement("div");
      card.className = "card " + (who === "You" ? "student" : "advisor");
      const tab = document.createElement("span");
      tab.className = "tab";
      tab.textContent = who;
      const content = document.createElement("div");
      content.className = "content";
      content.innerHTML = formatText(text);
      card.appendChild(tab);
      card.appendChild(content);
      chatDiv.appendChild(card);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      return card;
    }

    function ask(text) {
      input.value = text;
      send();
    }

    async function send() {
      const question = input.value.trim();
      if (!question) return;
      addMessage(question, "You");
      input.value = "";

      const thinking = addMessage("&hellip;", "Advisor");

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question: question }),
      });
      const data = await response.json();
      thinking.querySelector(".content").innerHTML = formatText(data.answer);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    document.getElementById("send").addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
